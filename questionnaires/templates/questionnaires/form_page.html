{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm mx-auto" style="max-width: 700px;">

    <div class="card-body p-4">

        <h3 class="mb-4">{{ title }}</h3>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                {{ submit_label }}
            </button>

            <a href="{% url 'manager_dashboard' %}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
